.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

<header><div class="ph"></div><div class="in"><svg class="ic" viewBox="0 0 120 120" width="104" height="104" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="none" stroke="#fff" stroke-width="3"/><g fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M60 34 92 50 60 66 28 50Z"/><path d="M28 62 60 78 92 62"/><path d="M28 74 60 90 92 74"/></g></svg><div><h1>การบริหารสินค้ากระเบื้อง <em id="sz">16×16 นิ้ว</em></h1><p class="s">สรุปสต็อก • ยอดขาย • การหมุนเวียนสินค้า</p><p class="dt" id="asof"></p></div></div></header>
<main>

<script>
const ZS=window.ZS_DATA;for(const k in ZS)ZS[k].forEach(r=>r[14]=k);let SZ='16*16',ROWS=ZS[SZ];const gr=()=>SZ=='ALL'?Object.values(ZS).flat():ZS[SZ];const ttl=()=>$('sz').textContent=SZ=='ALL'?'ทุกขนาด':SZ.replace('*','×')+' นิ้ว';const IMG=window.IMG_DATA;

const RK={out:0,low:1,nox:2,over:3,slow:4,dead:5,new:6,best:7,ok:8,cancel:9},SN=['','ตัดล็อต','ยกเลิกผลิต','ยกเลิกสั่ง'];
const f=n=>Math.round(n).toLocaleString('th-TH'),f1=n=>(Math.round(n*10)/10).toLocaleString('th-TH');
const $=i=>document.getElementById(i);let D=[],ASOF=new Date(),S=new Set(),card=false,NI=false,MS=new Set(['sale']),MG=20,UM='baht';

function calc(){const mx=ROWS.map(r=>r[11]).filter(Boolean).sort().pop();ASOF=mx?new Date(mx):new Date();
D=ROWS.map(r=>{const[code,name,brand,loc,stock,show,claim,s3,s6,s9,lb,ls,price,note,szk,,,,q1]=r;const s1=q1??s3/3,avg=(PER==1?s1:PER==3?s3:PER==6?s6:s9)/PER,cov=avg>0?stock/avg:(stock>0?999:0),ds=ls?Math.round((ASOF-new Date(ls))/864e5):999;
const dn=lb?Math.round((Date.now()-new Date(lb))/864e5):9999,nw=dn<=P.newm*30;const sm=name.match(/(\*+)\s*$/);let st;if(stock<=0)st=sm?'cancel':'out';else if(avg>=P.slow&&cov<=P.low)st=sm?'nox':'low';else if(nw)st='new';else if(s9==0)st='dead';else if(cov>=P.over)st='over';else if(avg<P.slow||ds>P.days)st='slow';else if(avg>=P.best)st='best';else st='ok';
